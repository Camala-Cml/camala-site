  <header class="wrap topbar">

      <a href="index.html" class="logo-lockup">

    <div class="film-grid">

      <!-- Repita este bloco <article> pra cada filme -->
      <article>
        <div class="film-card-thumb grain">
          <div class="corner"></div>
          <div class="play">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 5L19 12L8 19V5Z" stroke="#F4F2ED" stroke-width="2" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="film-card-title">[Nome do filme]</div>
        <div class="film-card-meta">[2026]</div>
      </article>

      <article>
        <div class="film-card-thumb grain">
          <div class="corner"></div>
          <div class="play">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 5L19 12L8 19V5Z" stroke="#F4F2ED" stroke-width="2" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="film-card-title">[Nome do filme]</div>
        <div class="film-card-meta">[2026]</div>

      <div class="eyebrow">GALERIA</div>
      <h1 class="h1">Imagens em IA</h1>
    </div>

    <div class="gallery-grid">
      <!-- Troque o background de cada .gallery-tile por uma <img> quando as imagens estiverem prontas -->
      <div class="gallery-tile grain">
        <div class="gallery-tile-label">[Imagem IA 01]</div>
      </div>
      <div class="gallery-tile grain">
        <div class="gallery-tile-label">[Imagem IA 02]</div>
